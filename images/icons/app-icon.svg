<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="pwaBg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F7F4EC"/>
      <stop offset="100%" stop-color="#EBE5D8"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7836"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#C9182B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#554128" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 角丸アイコンベース -->
  <rect width="512" height="512" rx="112" fill="url(#pwaBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>

  <!-- モンスターボールシンボル -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- 上半分 赤 -->
    <path d="M -150,0 A 150,150 0 0,1 150,0 Z" fill="url(#redGrad)"/>
    <!-- 下半分 白 -->
    <path d="M -150,0 A 150,150 0 0,0 150,0 Z" fill="#FFFFFF"/>
    <!-- 外枠 -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="16"/>
    <!-- 中央帯 -->
    <line x1="-150" y1="0" x2="150" y2="0" stroke="url(#goldGrad)" stroke-width="20"/>
    <!-- 中央ボタン -->
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="16"/>
    <circle cx="0" cy="0" r="26" fill="url(#redGrad)"/>
    <circle cx="-6" cy="-6" r="8" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
